name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Run mypy
        run: mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=aws_incident_copilot --cov-report=term-missing --cov-fail-under=70

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install pip-audit
          .audit-venv/bin/pip install -e .
          .audit-venv/bin/pip-audit

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli
          skip_check: CKV_AWS_158,CKV_AWS_144,CKV_AWS_145,CKV_AWS_338,CKV_AWS_355,CKV_AWS_117,CKV_AWS_173,CKV_AWS_356

  demo-e2e:
    name: Demo E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E pytest
        run: pytest tests/e2e/ -v --tb=short

      - name: Run CLI demo for every scenario
        run: |
          set -euo pipefail
          for scenario in crashloop oom alb-5xx; do
            echo "===== demo ${scenario} ====="
            python -m aws_incident_copilot.cli demo --scenario "${scenario}" --auto-approve \
              > "/tmp/demo-${scenario}.out" 2> "/tmp/demo-${scenario}.err"
            cat "/tmp/demo-${scenario}.out"
            cat "/tmp/demo-${scenario}.err" >&2
            if grep -Eiq 'tool not found|unrecognized tool|UNGROUNDED|MarkupError|Traceback' \
              "/tmp/demo-${scenario}.out" "/tmp/demo-${scenario}.err"; then
              echo "Demo ${scenario} failed integrity checks"
              exit 1
            fi
            if ! grep -q 'Demo complete' "/tmp/demo-${scenario}.out"; then
              echo "Demo ${scenario} did not print completion banner"
              exit 1
            fi
          done
